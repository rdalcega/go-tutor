<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Go Tutor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23222'/></svg>" />
  </head>
  <body>
    <div class="app">
      <main class="board-area">
        <div class="board-wrap" id="board-wrap">
          <canvas id="board" aria-label="Go board"></canvas>
        </div>
        <div class="caption-row" id="caption-row" hidden>
          <p class="caption" id="variation-label"></p>
          <button type="button" class="hide-overlay" id="hide-overlay" title="Hide the drawing (Esc)" aria-label="Hide the drawing">✕ Hide</button>
        </div>
      </main>

      <aside class="panel">
        <header class="panel-head">
          <h1>Go Tutor</h1>
          <span class="conn" id="conn" hidden>reconnecting…</span>
        </header>

        <section class="card status collapsible" data-card="status" aria-live="polite">
          <h2 class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true" aria-controls="status-body">
              <span class="turn" id="turn">Connecting…</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
          </h2>
          <div class="card-body" id="status-body">
            <dl class="facts">
              <div><dt>Captures</dt><dd id="captures">–</dd></div>
              <div><dt>Bot</dt><dd id="bot-rank">–</dd></div>
              <div><dt>Tutor</dt><dd><span class="dot" id="tutor-dot"></span><span id="tutor-text">–</span></dd></div>
            </dl>
          </div>
        </section>

        <section class="card controls collapsible" data-card="controls">
          <h2 class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true" aria-controls="controls-body">
              <span class="label">Controls</span>
              <span class="card-summary" id="level-summary"></span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
          </h2>
          <div class="card-body" id="controls-body">
            <div class="row">
              <button id="pass" title="Pass (P)">Pass</button>
              <button id="take-back" title="Take back your last move (and the bot's reply)">Take back</button>
              <button id="practice" title="Practice problems: from your mistakes, and generated at your level">Practice</button>
              <button id="review-game" hidden>Review mistakes</button>
              <button id="resign" class="danger">Resign</button>
            </div>
            <fieldset class="levels" id="levels">
              <legend>Tutor help during games</legend>
              <div class="segmented" id="level-options"></div>
              <p class="level-desc" id="level-desc"></p>
            </fieldset>
            <fieldset class="levels" id="judges">
              <legend>Judge my moves</legend>
              <div class="segmented" id="judge-options"></div>
              <p class="level-desc" id="judge-desc"></p>
            </fieldset>
            <form class="new-game" id="new-game">
              <label>Size
                <select id="ng-size">
                  <option value="9">9×9</option>
                  <option value="13">13×13</option>
                  <option value="19">19×19</option>
                </select>
              </label>
              <label>Bot
                <select id="ng-rank"></select>
              </label>
              <label>You
                <select id="ng-color">
                  <option value="B">Black</option>
                  <option value="W">White</option>
                </select>
              </label>
              <button type="submit" class="primary">New game</button>
            </form>
          </div>
        </section>

        <section class="card moment" id="moment" hidden>
          <div class="moment-head">
            <strong id="moment-title">Teaching moment</strong>
            <span class="countdown" id="moment-countdown"></span>
          </div>
          <p id="moment-text"></p>
          <div class="row">
            <button id="continue" class="primary" title="Continue (Enter)">Continue</button>
            <button id="retry">Try again</button>
          </div>
        </section>

        <section class="card problem" id="problem" hidden aria-live="polite">
          <div class="moment-head">
            <strong id="problem-title">Problem</strong>
            <span class="attempts" id="problem-attempts"></span>
          </div>
          <p id="problem-text"></p>
          <p class="problem-result" id="problem-result" hidden></p>
          <div class="row">
            <button id="next-problem" class="primary">Next problem</button>
            <button id="leave-problem">Back to playing</button>
          </div>
        </section>

        <section class="card eval collapsible" id="eval" data-card="eval">
          <h2 class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true" aria-controls="eval-body">
              <span class="label">Last move</span>
              <span class="loss card-summary" id="eval-loss">–</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
          </h2>
          <div class="card-body" id="eval-body">
            <p class="eval-detail" id="eval-detail">No moves yet.</p>
            <svg class="spark" id="spark" viewBox="0 0 300 44" preserveAspectRatio="none" aria-label="Point loss per move"></svg>
          </div>
        </section>

        <section class="card progress collapsible" id="progress" data-card="progress" hidden>
          <h2 class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true" aria-controls="progress-body">
              <span class="label">Progress</span>
              <span class="rank card-summary" id="pr-rank" title="Your estimated rank">–</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
          </h2>
          <div class="card-body" id="progress-body">
            <dl class="facts">
              <div><dt>Estimate</dt><dd id="pr-estimate">–</dd></div>
              <div><dt>Next bot</dt><dd id="pr-bot">–</dd></div>
              <div><dt>Games</dt><dd id="pr-games">–</dd></div>
              <div><dt>Pauses at</dt><dd id="pr-threshold" title="A move that loses this many points is a teaching moment">–</dd></div>
              <div><dt>Work on</dt><dd id="pr-cats">–</dd></div>
              <div id="pr-problems-row" hidden><dt>Problems</dt><dd id="pr-problems">–</dd></div>
            </dl>
            <svg class="spark rating-spark" id="pr-spark" viewBox="0 0 300 32" preserveAspectRatio="none" aria-label="Rating over recent games"></svg>
          </div>
        </section>

        <section class="card chat">
          <ol class="chat-log" id="chat-log" aria-live="polite"></ol>
          <form class="chat-form" id="chat-form">
            <input id="chat-input" type="text" placeholder="Ask your tutor…" autocomplete="off" />
            <button type="button" id="hint" title="Ask for a hint (H); anything you typed goes with it">Hint</button>
            <button type="submit">Send</button>
          </form>
        </section>
      </aside>
    </div>

    <dialog id="result-dialog" class="result">
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <p class="result-rating" id="result-rating" hidden></p>
      <ul id="result-mistakes"></ul>
      <div class="row">
        <button id="result-review" hidden>Review mistakes</button>
        <button id="result-new" class="primary">New game</button>
        <button id="result-close">Close</button>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
